<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Суфлёр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b0f16;
    --bg-soft: #0f1520;
    --surface: rgba(20, 28, 42, 0.82);
    --surface-solid: #141c2a;
    --border: rgba(255, 255, 255, 0.07);
    --border-strong: rgba(255, 255, 255, 0.12);
    --text: #eef3fa;
    --muted: #7c8aa0;
    --read: #3f4b60;
    --accent: #5aa9ff;
    --accent-2: #8b5cf6;
    --error: #f87171;

    --font-size: 1.5rem;
    --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-family);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Мягкие градиентные пятна на фоне */
  body::before,
  body::after {
    content: '';
    position: fixed;
    width: 65vw;
    height: 65vw;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    pointer-events: none;
    opacity: 0.9;
  }
  body::before {
    top: -22vw;
    left: -18vw;
    background: radial-gradient(circle, rgba(90, 169, 255, 0.10) 0%, transparent 70%);
  }
  body::after {
    bottom: -28vw;
    right: -18vw;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.10) 0%, transparent 70%);
  }

  /* ===== Статус-бар сверху ===== */
  .statusbar {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 18px;
    background: var(--surface);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--muted);
    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.45),
      0 1px 0 rgba(255, 255, 255, 0.04) inset;
    transition: color 0.25s ease;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .statusbar.listening { color: #a7f3d0; }
  .statusbar.error { color: #fca5a5; }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.3s ease;
    flex-shrink: 0;
  }
  .dot.on {
    background: #10b981;
    box-shadow: 0 0 12px #10b981, 0 0 22px rgba(16, 185, 129, 0.45);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .dot.err {
    background: var(--error);
    box-shadow: 0 0 12px var(--error);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.82); }
  }

  /* ===== Прогресс ===== */
  .progress {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: transparent;
    z-index: 30;
    overflow: hidden;
  }
  .progress__bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
    transition: width 0.35s ease;
    box-shadow: 0 0 12px rgba(90, 169, 255, 0.6);
  }

  /* ===== Читалка ===== */
  .reader {
    position: fixed;
    top: 0;
    bottom: calc(126px + env(safe-area-inset-bottom, 0px));
    left: 0;
    right: 0;
    overflow-y: auto;
    padding: 82px 22px 60px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    z-index: 1;
  }
  .reader::-webkit-scrollbar { display: none; }

  .text {
    font-size: var(--font-size);
    line-height: 1.72;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.012em;
    word-spacing: 2px;
    max-width: 640px;
    margin: 0 auto;
    animation: fadeIn 0.55s ease-out;
    transition: font-size 0.25s ease, line-height 0.25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .word {
    display: inline;
    transition: color 0.4s ease, opacity 0.4s ease;
  }
  .word.read {
    color: var(--read);
    opacity: 0.5;
  }

  /* Первая подсказка */
  .hint {
    position: fixed;
    bottom: calc(116px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.85rem;
    color: var(--muted);
    z-index: 15;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.4s ease;
    white-space: nowrap;
    animation: hintPulse 2.6s ease-in-out infinite;
  }
  .hint.hidden { opacity: 0; }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }

  /* ===== Нижняя капсула ===== */
  .navbar {
    position: fixed;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 440px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px;
    background: var(--surface);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--border-strong);
    border-radius: 36px;
    box-shadow:
      0 24px 48px -12px rgba(0, 0, 0, 0.7),
      0 1px 0 rgba(255, 255, 255, 0.06) inset;
    z-index: 20;
  }

  .navbtn {
    flex: 1;
    height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 0.68rem;
    font-weight: 500;
    font-family: inherit;
    border-radius: 28px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
    letter-spacing: 0.02em;
  }
  .navbtn .icon {
    font-size: 1.35rem;
    line-height: 1;
    display: block;
  }
  .navbtn:active { transform: scale(0.93); background: rgba(255, 255, 255, 0.05); }

  .navbtn.main {
    flex: 1.7;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.88rem;
    box-shadow:
      0 10px 24px -6px rgba(90, 169, 255, 0.55),
      0 0 0 0.5px rgba(255, 255, 255, 0.18) inset;
    flex-direction: row;
    gap: 9px;
    letter-spacing: 0;
  }
  .navbtn.main .icon { font-size: 1.05rem; }
  .navbtn.main:active { transform: scale(0.96); }
  .navbtn.main.paused {
    background: linear-gradient(135deg, #4b5a72 0%, #334155 100%);
    box-shadow:
      0 10px 24px -6px rgba(71, 85, 105, 0.5),
      0 0 0 0.5px rgba(255, 255, 255, 0.12) inset;
  }

  /* ===== Bottom Sheet выбора шрифта ===== */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 90;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s;
  }
  .sheet-backdrop.open { opacity: 1; visibility: visible; }

  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    background: var(--surface-solid);
    border-radius: 28px 28px 0 0;
    border-top: 1px solid var(--border-strong);
    padding: 12px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6);
    max-width: 520px;
    margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }

  .sheet__handle {
    width: 40px;
    height: 4px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.15);
    margin: 0 auto 18px;
  }

  .sheet__title {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .sheet__section { margin-bottom: 22px; }
  .sheet__section:last-child { margin-bottom: 0; }

  /* Размер шрифта */
  .size-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 16px;
  }
  .size-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.15s;
  }
  .size-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.1); }

  .size-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.1);
    outline: none;
  }
  .size-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(90, 169, 255, 0.5);
  }
  .size-slider::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(90, 169, 255, 0.5);
  }
  .size-value {
    min-width: 44px;
    text-align: right;
    font-size: 0.85rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Шрифты */
  .fonts {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .font-opt {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 14px;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: all 0.18s ease;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .font-opt:active { transform: scale(0.98); }
  .font-opt.active {
    border-color: rgba(90, 169, 255, 0.6);
    background: rgba(90, 169, 255, 0.08);
    box-shadow: 0 0 0 3px rgba(90, 169, 255, 0.08);
  }
  .font-opt__name {
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.2;
  }
  .font-opt__preview {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div class="progress"><div class="progress__bar" id="progressbar"></div></div>

<div class="statusbar" id="statusbar">
  <div class="dot" id="dot"></div>
  <span id="status">Готов к чтению</span>
</div>

<div class="reader" id="reader">
  <div class="text" id="text"></div>
</div>

<div class="hint" id="hint">Нажми «Старт» — и читай вслух</div>

<div class="navbar">
  <button class="navbtn" id="btn-reset" aria-label="Сначала">
    <span class="icon">↺</span>
  </button>
  <button class="navbtn main" id="btn-toggle">
    <span class="icon" id="toggle-icon">▶</span>
    <span id="toggle-label">Старт</span>
  </button>
  <button class="navbtn" id="btn-font" aria-label="Шрифт">
    <span class="icon">Aa</span>
  </button>
</div>

<!-- ===== Bottom Sheet ===== -->
<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet__handle"></div>

  <div class="sheet__section">
    <div class="sheet__title">Размер текста</div>
    <div class="size-row">
      <button class="size-btn" id="size-minus">−</button>
      <input type="range" class="size-slider" id="size-slider" min="18" max="40" step="1" value="24">
      <button class="size-btn" id="size-plus">+</button>
      <span class="size-value" id="size-value">24px</span>
    </div>
  </div>

  <div class="sheet__section">
    <div class="sheet__title">Шрифт</div>
    <div class="fonts" id="fonts">
      <button class="font-opt active" data-font="system">
        <span class="font-opt__name" style="font-family: -apple-system, system-ui, sans-serif;">Системный</span>
        <span class="font-opt__preview">SF Pro / Roboto</span>
      </button>
      <button class="font-opt" data-font="serif">
        <span class="font-opt__name" style="font-family: Georgia, 'Times New Roman', serif;">С засечками</span>
        <span class="font-opt__preview">Georgia</span>
      </button>
      <button class="font-opt" data-font="mono">
        <span class="font-opt__name" style="font-family: 'SF Mono', Menlo, monospace;">Моно</span>
        <span class="font-opt__preview">SF Mono / Menlo</span>
      </button>
      <button class="font-opt" data-font="rounded">
        <span class="font-opt__name" style="font-family: 'SF Pro Rounded', 'Nunito', system-ui, sans-serif;">Округлый</span>
        <span class="font-opt__preview">Rounded</span>
      </button>
    </div>
  </div>
</div>

<script>
const SOURCE = `Русь! Русь! вижу тебя, из моего чудного, прекрасного далека тебя вижу: бедно, разбросанно и неприютно в тебе; не развеселят, не испугают взоров дерзкие дива природы, венчанные дерзкими дивами искусства, города с многооконными высокими дворцами, вросшими в утесы, картинные дерева и плющи, вросшие в домы, в шуме и в вечной пыли водопадов; не опрокинется назад голова посмотреть на громоздящиеся без конца над нею и в вышине каменные глыбы; не блеснут сквозь наброшенные одна на другую темные арки, опутанные виноградными сучьями, плющами и несметными миллионами диких роз, не блеснут сквозь них вдали вечные линии сияющих гор, несущихся в серебряные ясные небеса. Открыто-пустынно и ровно все в тебе; как точки, как значки, неприметно торчат среди равнин невысокие твои города; ничто не обольстит и не очарует взора. Но какая же непостижимая, тайная сила влечет к тебе? Почему слышится и раздается немолчно в ушах твоя тоскливая, несущаяся по всей длине и ширине твоей, от моря до моря, песня? Что в ней, в этой песне? Что зовет, и рыдает, и хватает за сердце? Какие звуки болезненно лобзают, и стремятся в душу, и вьются около моего сердца? Русь! чего же ты хочешь от меня? какая непостижимая связь таится между нами? Что глядишь ты так, и зачем все, что ни есть в тебе, обратило на меня полные ожидания очи?.. И еще, полный недоумения, неподвижно стою я, а уже главу осенило грозное облако, тяжелое грядущими дождями, и онемела мысль пред твоим пространством. Что пророчит сей необъятный простор? Здесь ли, в тебе ли не родиться беспредельной мысли, когда ты сама без конца? Здесь ли не быть богатырю, когда есть место, где развернуться и пройтись ему? И грозно объемлет меня могучее пространство, страшною силою отразясь во глубине моей; неестественной властью осветились мои очи: у! какая сверкающая, чудная, незнакомая земле даль! Русь!..`;

const state = {
  words: [],
  idx: 0,
  listening: false,
  paused: false,
  lastAdvance: 0,
  recent: [],           // буфер последних распознанных слов (нормализованных)
  recentConsumed: 0,    // сколько последних слов уже "съедено"
};

const $ = id => document.getElementById(id);
const readerEl = $('reader');
const textEl = $('text');
const dotEl = $('dot');
const statusEl = $('status');
const statusbarEl = $('statusbar');
const toggleBtn = $('btn-toggle');
const toggleIcon = $('toggle-icon');
const toggleLabel = $('toggle-label');
const hintEl = $('hint');
const progressBar = $('progressbar');

/* ================= утилиты ================= */

function normalize(w) {
  return w.toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9]/g, '');
}

function lev(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  if (Math.abs(a.length - b.length) > 2) return 99;
  const m = a.length, n = b.length;
  let prev = new Array(n + 1), curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j-1] + 1, prev[j-1] + cost);
    }
    [prev, curr] = [curr, prev];
  }
  return prev[n];
}

function wordMatch(a, b) {
  if (!a || !b) return false;
  if (a === b) return true;
  const len = Math.min(a.length, b.length);
  if (len <= 3) return false;
  if (len <= 5) return lev(a, b) <= 1;
  return lev(a, b) <= 2;
}

/* ================= инициализация ================= */

function initText(raw) {
  textEl.innerHTML = '';
  state.words = [];
  state.idx = 0;
  state.recent = [];
  state.recentConsumed = 0;

  const tokens = raw.trim().split(/\s+/);
  tokens.forEach(tok => {
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = tok;
    textEl.appendChild(span);
    textEl.appendChild(document.createTextNode(' '));
    state.words.push({ raw: tok, norm: normalize(tok), el: span });
  });
  render();
}

function render() {
  state.words.forEach((w, i) => {
    w.el.classList.toggle('read', i < state.idx);
  });
  const total = state.words.length || 1;
  progressBar.style.width = ((state.idx / total) * 100).toFixed(2) + '%';
  scrollToWord(state.idx, true);
}

/* ================= плавный скролл ================= */

let scrollAnim = null;
function scrollToWord(idx, smooth) {
  if (idx >= state.words.length) idx = state.words.length - 1;
  if (idx < 0) idx = 0;
  const el = state.words[idx]?.el;
  if (!el) return;

  const readerRect = readerEl.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  const targetOffset = readerRect.height * 0.38;
  const currentOffset = elRect.top - readerRect.top;
  const delta = currentOffset - targetOffset;
  const targetScroll = readerEl.scrollTop + delta;

  if (scrollAnim) cancelAnimationFrame(scrollAnim);
  if (!smooth) { readerEl.scrollTop = targetScroll; return; }

  const start = readerEl.scrollTop;
  const end = targetScroll;
  const dur = 520;
  const t0 = performance.now();
  const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;

  function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    readerEl.scrollTop = start + (end - start) * ease(p);
    if (p < 1) scrollAnim = requestAnimationFrame(step);
    else scrollAnim = null;
  }
  scrollAnim = requestAnimationFrame(step);
}

/* ================= распознавание ================= */

let recognition = null;
let restartTimer = null;

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setStatus('Распознавание не поддерживается', 'err'); return false; }
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => setStatus('Слушаю...', 'on');

  recognition.onresult = (e) => {
    if (state.paused || !state.listening) return;
    let text = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      text += e.results[i][0].transcript + ' ';
    }
    handleSpoken(text);
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed') { setStatus('Нет доступа к микрофону', 'err'); stopAll(); }
    else if (e.error === 'no-speech') { /* ok */ }
    else { setStatus('Ошибка: ' + e.error, 'err'); }
  };

  recognition.onend = () => {
    if (state.listening && !state.paused) {
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => { try { recognition.start(); } catch (_) {} }, 300);
    }
  };
  return true;
}

/* ================= КОНТЕКСТНЫЙ МАТЧИНГ ================= */

const CONTEXT_LEN = 3;       // сколько последних слов держим в буфере
const SEARCH_WINDOW = 4;     // на сколько слов вперёд смотрим

function handleSpoken(transcript) {
  const spokenWords = transcript.split(/\s+/).map(normalize).filter(w => w.length >= 2);
  if (!spokenWords.length) return;

  // Добавляем все новые слова в буфер
  for (const w of spokenWords) {
    state.recent.push(w);
  }
  // буфер не длиннее CONTEXT_LEN + небольшой запас
  if (state.recent.length > CONTEXT_LEN * 3) {
    const drop = state.recent.length - CONTEXT_LEN * 3;
    state.recent.splice(0, drop);
  }

  tryAdvance();
}

function tryAdvance() {
  let advanced = true;
  let safety = 0;

  while (advanced && safety < 50) {
    advanced = false;
    safety++;

    // Пробуем от самого длинного контекста к короткому
    for (let ctx = CONTEXT_LEN; ctx >= 1; ctx--) {
      if (state.recent.length < ctx) continue;

      const spokenCtx = state.recent.slice(-ctx);
      // Ищем в тексте последовательность ctx слов, начиная с позиции idx
      for (let off = 0; off <= SEARCH_WINDOW; off++) {
        const startIdx = state.idx + off;
        if (startIdx + ctx > state.words.length) break;

        let ok = true;
        for (let k = 0; k < ctx; k++) {
          const target = state.words[startIdx + k].norm;
          if (!wordMatch(spokenCtx[k], target)) { ok = false; break; }
        }

        if (ok) {
          // Совпал контекст — продвигаемся ровно на ctx слов
          state.idx = startIdx + ctx;
          // удаляем "съеденные" слова из буфера
          state.recent.splice(state.recent.length - ctx, ctx);
          render();
          advanced = true;
          break;
        }
      }
      if (advanced) break;
    }
  }
}

/* ================= статус и управление ================= */

function setStatus(text, mode) {
  statusEl.textContent = text;
  dotEl.classList.remove('on', 'err');
  statusbarEl.classList.remove('listening', 'error');
  if (mode === 'on') { dotEl.classList.add('on'); statusbarEl.classList.add('listening'); }
  else if (mode === 'err') { dotEl.classList.add('err'); statusbarEl.classList.add('error'); }
}

function start() {
  if (!recognition && !initRecognition()) return;
  try { recognition.start(); } catch (_) {}
  state.listening = true;
  state.paused = false;
  toggleIcon.textContent = '⏸';
  toggleLabel.textContent = 'Пауза';
  toggleBtn.classList.remove('paused');
  hintEl.classList.add('hidden');
  setStatus('Слушаю...', 'on');
  window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('medium');
}

function pause() {
  state.paused = true;
  state.listening = false;
  try { recognition && recognition.stop(); } catch (_) {}
  toggleIcon.textContent = '▶';
  toggleLabel.textContent = 'Продолжить';
  toggleBtn.classList.add('paused');
  setStatus('Пауза');
}

function stopAll() {
  state.listening = false;
  state.paused = false;
  try { recognition && recognition.stop(); } catch (_) {}
  toggleIcon.textContent = '▶';
  toggleLabel.textContent = 'Старт';
  toggleBtn.classList.add('paused');
  setStatus('Остановлено');
}

toggleBtn.addEventListener('click', () => state.listening ? pause() : start());

$('btn-reset').addEventListener('click', () => {
  state.idx = 0;
  state.recent = [];
  render();
  readerEl.scrollTop = 0;
  window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light');
});

/* ================= Bottom Sheet ================= */

const sheet = $('sheet');
const sheetBackdrop = $('sheet-backdrop');

function openSheet() {
  sheet.classList.add('open');
  sheetBackdrop.classList.add('open');
  window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light');
}
function closeSheet() {
  sheet.classList.remove('open');
  sheetBackdrop.classList.remove('open');
}

$('btn-font').addEventListener('click', openSheet);
sheetBackdrop.addEventListener('click', closeSheet);

/* ================= Размер шрифта ================= */

const slider = $('size-slider');
const sizeValue = $('size-value');
const MIN_SIZE = 18, MAX_SIZE = 40;
let fontSize = 24;

function applyFontSize(v) {
  fontSize = Math.max(MIN_SIZE, Math.min(MAX_SIZE, v));
  document.documentElement.style.setProperty('--font-size', fontSize + 'px');
  slider.value = fontSize;
  sizeValue.textContent = fontSize + 'px';
  try { localStorage.setItem('sufleur_size', fontSize); } catch(_) {}
}

slider.addEventListener('input', e => applyFontSize(+e.target.value));
$('size-minus').addEventListener('click', () => applyFontSize(fontSize - 2));
$('size-plus').addEventListener('click', () => applyFontSize(fontSize + 2));

/* ================= Шрифты ================= */

const FONTS = {
  system: `-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, Roboto, sans-serif`,
  serif: `Georgia, "Times New Roman", "PT Serif", serif`,
  mono: `"SF Mono", ui-monospace, Menlo, Consolas, monospace`,
  rounded: `"SF Pro Rounded", "Nunito", "Comfortaa", system-ui, sans-serif`,
};

document.querySelectorAll('.font-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.font;
    document.querySelectorAll('.font-opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.documentElement.style.setProperty('--font-family', FONTS[key]);
    try { localStorage.setItem('sufleur_font', key); } catch(_) {}
    window.Telegram?.WebApp?.HapticFeedback?.selectionChanged?.();
  });
});

/* ================= восстанавливаем настройки ================= */

try {
  const savedSize = +localStorage.getItem('sufleur_size');
  if (savedSize) applyFontSize(savedSize); else applyFontSize(24);

  const savedFont = localStorage.getItem('sufleur_font');
  if (savedFont && FONTS[savedFont]) {
    document.documentElement.style.setProperty('--font-family', FONTS[savedFont]);
    document.querySelectorAll('.font-opt').forEach(b => {
      b.classList.toggle('active', b.dataset.font === savedFont);
    });
  }
} catch(_) { applyFontSize(24); }

/* ================= Telegram ================= */

try {
  if (window.Telegram?.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.disableVerticalSwipes?.();
    tg.setHeaderColor?.('#0b0f16');
    tg.setBackgroundColor?.('#0b0f16');
  }
} catch (_) {}

initText(SOURCE);
</script>
