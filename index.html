<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Суфлёр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --surface: #1a2332;
    --border: #2a3547;
    --text: #e8eef7;
    --muted: #8b97a8;
    --read: #4a5568;
    --accent: #4a9eff;
    --error: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  }

  /* Верхняя тонкая плашка со статусом */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--muted);
    background: rgba(15, 20, 25, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s;
  }
  .dot.on { background: #10b981; box-shadow: 0 0 8px #10b981; }
  .dot.err { background: var(--error); box-shadow: 0 0 8px var(--error); }

  /* Читалка */
  .reader {
    position: fixed;
    top: 40px;
    bottom: 64px;
    left: 0; right: 0;
    overflow-y: auto;
    padding: 20px 18px 40px;
    scroll-behavior: auto; /* мы скроллим вручную */
    -webkit-overflow-scrolling: touch;
  }
  .reader::-webkit-scrollbar { width: 0; }

  .text {
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--text);
    word-spacing: 1px;
  }

  .word {
    display: inline;
    transition: color 0.35s ease, opacity 0.35s ease;
    padding: 1px 0;
  }
  .word.read {
    color: var(--read);
    opacity: 0.55;
  }

  /* Нижняя навигация */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 64px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 8px;
    padding-bottom: env(safe-area-inset-bottom, 0);
    z-index: 10;
  }
  .navbtn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 0.7rem;
    font-weight: 500;
    padding: 8px 4px;
    border-radius: 10px;
    transition: color 0.15s, background 0.15s;
    cursor: pointer;
    font-family: inherit;
  }
  .navbtn .icon { font-size: 1.25rem; line-height: 1; }
  .navbtn:active { background: rgba(74, 158, 255, 0.1); }
  .navbtn.primary { color: var(--accent); }
  .navbtn.active { color: var(--accent); }
  .navbtn:disabled { opacity: 0.35; }

  /* Стартовый оверлей */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    text-align: center;
    gap: 20px;
    z-index: 100;
    transition: opacity 0.3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h1 { font-size: 1.4rem; font-weight: 600; }
  .overlay p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; max-width: 320px; }
  .bigbtn {
    background: var(--accent);
    color: #0f1419;
    border: none;
    border-radius: 14px;
    padding: 14px 34px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .bigbtn:active { transform: scale(0.97); }
</style>
</head>
<body>

<div class="topbar">
  <div class="dot" id="dot"></div>
  <span id="status">Готов</span>
</div>

<div class="reader" id="reader">
  <div class="text" id="text"></div>
</div>

<div class="navbar">
  <button class="navbtn" id="btn-reset"><span class="icon">↺</span>Сначала</button>
  <button class="navbtn" id="btn-prev"><span class="icon">‹</span>Назад</button>
  <button class="navbtn primary" id="btn-toggle"><span class="icon">▶</span><span id="toggle-label">Старт</span></button>
  <button class="navbtn" id="btn-next"><span class="icon">›</span>Вперёд</button>
  <button class="navbtn" id="btn-tts"><span class="icon">🎧</span>Озвучка</button>
</div>

<div class="overlay" id="overlay">
  <h1>📜 Суфлёр</h1>
  <p>Читай вслух — текст сам будет плавно прокручиваться за твоим голосом.</p>
  <p style="font-size:0.8rem;opacity:0.7">Нажми «Старт» и разреши доступ к микрофону.</p>
  <button class="bigbtn" id="btn-go">Начать</button>
</div>

<script>
// ================== ТЕКСТ ==================
const SOURCE = `Русь! Русь! вижу тебя, из моего чудного, прекрасного далека тебя вижу: бедно, разбросанно и неприютно в тебе; не развеселят, не испугают взоров дерзкие дива природы, венчанные дерзкими дивами искусства, города с многооконными высокими дворцами, вросшими в утесы, картинные дерева и плющи, вросшие в домы, в шуме и в вечной пыли водопадов; не опрокинется назад голова посмотреть на громоздящиеся без конца над нею и в вышине каменные глыбы; не блеснут сквозь наброшенные одна на другую темные арки, опутанные виноградными сучьями, плющами и несметными миллионами диких роз, не блеснут сквозь них вдали вечные линии сияющих гор, несущихся в серебряные ясные небеса. Открыто-пустынно и ровно все в тебе; как точки, как значки, неприметно торчат среди равнин невысокие твои города; ничто не обольстит и не очарует взора. Но какая же непостижимая, тайная сила влечет к тебе? Почему слышится и раздается немолчно в ушах твоя тоскливая, несущаяся по всей длине и ширине твоей, от моря до моря, песня? Что в ней, в этой песне? Что зовет, и рыдает, и хватает за сердце? Какие звуки болезненно лобзают, и стремятся в душу, и вьются около моего сердца? Русь! чего же ты хочешь от меня? какая непостижимая связь таится между нами? Что глядишь ты так, и зачем все, что ни есть в тебе, обратило на меня полные ожидания очи?.. И еще, полный недоумения, неподвижно стою я, а уже главу осенило грозное облако, тяжелое грядущими дождями, и онемела мысль пред твоим пространством. Что пророчит сей необъятный простор? Здесь ли, в тебе ли не родиться беспредельной мысли, когда ты сама без конца? Здесь ли не быть богатырю, когда есть место, где развернуться и пройтись ему? И грозно объемлет меня могучее пространство, страшною силою отразясь во глубине моей; неестественной властью осветились мои очи: у! какая сверкающая, чудная, незнакомая земле даль! Русь!..`;

// ================== СОСТОЯНИЕ ==================
const state = {
  words: [],
  idx: 0,
  listening: false,
  paused: false,
  tts: false,
  lastAdvance: 0,       // время последнего продвижения
  recentSpoken: [],     // окно последних распознанных слов
};

// ================== DOM ==================
const $ = id => document.getElementById(id);
const readerEl = $('reader');
const textEl = $('text');
const dotEl = $('dot');
const statusEl = $('status');
const toggleBtn = $('btn-toggle');
const toggleLabel = $('toggle-label');
const ttsBtn = $('btn-tts');

// ================== УТИЛИТЫ ==================
function normalize(w) {
  return w.toLowerCase()
    .replace(/ё/g, 'е')
    .replace(/[^а-яa-z0-9]/g, '');
}

// расстояние Левенштейна для нечёткого сравнения
function lev(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  if (Math.abs(a.length - b.length) > 2) return 99;
  const m = a.length, n = b.length;
  let prev = new Array(n + 1);
  let curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j-1] + 1, prev[j-1] + cost);
    }
    [prev, curr] = [curr, prev];
  }
  return prev[n];
}

// порог похожести: чем короче слово, тем строже
function isMatch(spoken, target) {
  if (!spoken || !target) return false;
  if (spoken === target) return true;
  const len = Math.min(spoken.length, target.length);
  if (len <= 3) return spoken === target;
  if (len <= 5) return lev(spoken, target) <= 1;
  return lev(spoken, target) <= 2;
}

// ================== ИНИЦИАЛИЗАЦИЯ ТЕКСТА ==================
function initText(raw) {
  textEl.innerHTML = '';
  state.words = [];
  state.idx = 0;

  const tokens = raw.trim().split(/\s+/);
  tokens.forEach(tok => {
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = tok;
    textEl.appendChild(span);
    textEl.appendChild(document.createTextNode(' '));
    state.words.push({
      raw: tok,
      norm: normalize(tok),
      el: span,
    });
  });
  render();
}

// ================== ОТРИСОВКА (без выделения текущего слова) ==================
function render() {
  state.words.forEach((w, i) => {
    w.el.classList.toggle('read', i < state.idx);
  });
  // плавно центрируем текущее слово
  scrollToWord(state.idx, true);
}

// ================== ПЛАВНЫЙ СКРОЛЛ ==================
let scrollAnim = null;
function scrollToWord(idx, smooth) {
  if (idx >= state.words.length) idx = state.words.length - 1;
  if (idx < 0) idx = 0;
  const el = state.words[idx].el;
  if (!el) return;

  const readerRect = readerEl.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  // хотим, чтобы слово было примерно на 35% высоты читалки (чуть выше центра)
  const targetOffset = readerRect.height * 0.35;
  const currentOffset = elRect.top - readerRect.top;
  const delta = currentOffset - targetOffset;
  const targetScroll = readerEl.scrollTop + delta;

  if (scrollAnim) cancelAnimationFrame(scrollAnim);
  if (!smooth) {
    readerEl.scrollTop = targetScroll;
    return;
  }

  const start = readerEl.scrollTop;
  const end = targetScroll;
  const dur = 420;
  const t0 = performance.now();

  function ease(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }

  function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    readerEl.scrollTop = start + (end - start) * ease(p);
    if (p < 1) scrollAnim = requestAnimationFrame(step);
    else scrollAnim = null;
  }
  scrollAnim = requestAnimationFrame(step);
}

// ================== РАСПОЗНАВАНИЕ ==================
let recognition = null;
let restartTimer = null;

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setStatus('Распознавание не поддерживается', 'err');
    return false;
  }
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    setStatus('Слушаю...', 'on');
  };

  recognition.onresult = (e) => {
    if (state.paused || !state.listening) return;
    // берём только последний финальный/интерim результат
    let text = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      text += e.results[i][0].transcript + ' ';
    }
    handleSpoken(text);
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed') {
      setStatus('Нет доступа к микрофону', 'err');
      stopAll();
    } else if (e.error === 'no-speech') {
      // нормально, просто тишина
    } else {
      setStatus('Ошибка: ' + e.error, 'err');
    }
  };

  recognition.onend = () => {
    if (state.listening && !state.paused) {
      // защита от гонок — рестарт с задержкой
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        try { recognition.start(); } catch (_) {}
      }, 300);
    }
  };
  return true;
}

// ================== ЛОГИКА СИНХРОНИЗАЦИИ ==================
const ADVANCE_COOLDOWN = 60;      // мс — не чаще чем раз в 60мс
const SEARCH_WINDOW = 3;          // искать только в пределах +3 слов от текущего

function handleSpoken(transcript) {
  const spokenWords = transcript.split(/\s+/).map(normalize).filter(w => w.length >= 2);
  if (!spokenWords.length) return;

  const now = performance.now();
  if (now - state.lastAdvance < ADVANCE_COOLDOWN) return;

  // ищем последнее произнесённое слово в ближайшем окне
  for (let s = spokenWords.length - 1; s >= 0; s--) {
    const spoken = spokenWords[s];

    for (let off = 0; off <= SEARCH_WINDOW; off++) {
      const targetIdx = state.idx + off;
      if (targetIdx >= state.words.length) break;

      const target = state.words[targetIdx].norm;
      if (!target) continue;

      if (isMatch(spoken, target)) {
        // продвигаем ровно на 1 слово (не прыгаем через несколько)
        state.idx = targetIdx + 1;
        state.lastAdvance = now;
        render();
        if (state.tts) speakWord(state.idx);
        return;
      }
    }
  }
}

// ================== TTS ==================
let voicesReady = false;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => v.lang.startsWith('ru')) || voices[0] || null;
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => { voicesReady = true; };
}

function speakWord(idx) {
  if (!state.tts || !('speechSynthesis' in window)) return;
  if (idx >= state.words.length) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(state.words[idx].raw);
  u.lang = 'ru-RU';
  u.rate = 1.0;
  u.volume = 0.9;
  const v = pickVoice();
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

// ================== СТАТУС ==================
function setStatus(text, mode) {
  statusEl.textContent = text;
  dotEl.classList.remove('on', 'err');
  if (mode === 'on') dotEl.classList.add('on');
  if (mode === 'err') dotEl.classList.add('err');
}

// ================== УПРАВЛЕНИЕ ==================
function start() {
  if (!recognition && !initRecognition()) return;
  try { recognition.start(); } catch (_) {}
  state.listening = true;
  state.paused = false;
  toggleBtn.querySelector('.icon').textContent = '⏸';
  toggleLabel.textContent = 'Пауза';
  toggleBtn.classList.add('active');
  setStatus('Слушаю...', 'on');
}

function pause() {
  state.paused = true;
  state.listening = false;
  try { recognition && recognition.stop(); } catch (_) {}
  toggleBtn.querySelector('.icon').textContent = '▶';
  toggleLabel.textContent = 'Старт';
  toggleBtn.classList.remove('active');
  setStatus('Пауза');
}

function stopAll() {
  state.listening = false;
  state.paused = false;
  try { recognition && recognition.stop(); } catch (_) {}
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  toggleBtn.querySelector('.icon').textContent = '▶';
  toggleLabel.textContent = 'Старт';
  toggleBtn.classList.remove('active');
  setStatus('Остановлено');
}

// ================== СОБЫТИЯ ==================
toggleBtn.addEventListener('click', () => {
  if (state.listening) pause();
  else start();
});

$('btn-reset').addEventListener('click', () => {
  state.idx = 0;
  render();
  readerEl.scrollTop = 0;
});

$('btn-prev').addEventListener('click', () => {
  state.idx = Math.max(0, state.idx - 1);
  render();
});

$('btn-next').addEventListener('click', () => {
  state.idx = Math.min(state.words.length, state.idx + 1);
  render();
});

ttsBtn.addEventListener('click', () => {
  state.tts = !state.tts;
  ttsBtn.classList.toggle('active', state.tts);
  if (!state.tts && 'speechSynthesis' in window) speechSynthesis.cancel();
  setStatus(state.tts ? 'Озвучка вкл' : 'Озвучка выкл');
});

$('btn-go').addEventListener('click', () => {
  $('overlay').classList.add('hidden');
  start();
});

// Telegram WebApp
try {
  if (window.Telegram?.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.disableVerticalSwipes?.();
  }
} catch (_) {}

// init
initText(SOURCE);
</script>
</body>
</html>
