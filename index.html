<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивный суфлер — Русь</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #64748b;
      --read-color: #475569;
      --target-bg: #2563eb;
      --target-color: #ffffff;
      --accent-color: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header { text-align: center; padding: 10px 0; }
    h1 { font-size: 1.8rem; margin-bottom: 6px; color: #f1f5f9; }
    .subtitle { color: #94a3b8; font-size: 0.95rem; }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #btn-toggle { background-color: #2563eb; color: white; }
    #btn-toggle:hover { background-color: #1d4ed8; }
    #btn-toggle.recording { background-color: #dc2626; animation: pulse 1.5s infinite; }

    #btn-reset { background-color: #334155; color: #f8fafc; }
    #btn-reset:hover { background-color: #475569; }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; background-color: #64748b; }
    .dot.active { background-color: var(--accent-color); box-shadow: 0 0 8px var(--accent-color); }

    .reader-box {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 50px 40px;
      height: 480px;
      overflow-y: auto;
      scroll-behavior: smooth;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .text-content {
      font-size: 1.6rem;
      line-height: 2.3;
      word-spacing: 4px;
      color: var(--text-color);
    }

    .word {
      padding: 3px 6px;
      border-radius: 6px;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
      display: inline-block;
    }

    .word.read { color: var(--read-color); opacity: 0.5; }
    .word.next-target {
      color: var(--target-color);
      background-color: var(--target-bg);
      font-weight: 700;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.6);
      transform: scale(1.05);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📜 Интерактивный суфлер — Гоголь "Русь"</h1>
    <p class="subtitle">Читайте текст вслух — сайт будет подсвечивать слова и прокручивать экран</p>
  </header>

  <div class="controls">
    <button id="btn-toggle">
      <span id="btn-icon">🎤</span>
      <span id="btn-text">Начать чтение</span>
    </button>
    <button id="btn-reset">🔄 Сбросить</button>

    <div class="status-indicator">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">Микрофон выключен</span>
    </div>
  </div>

  <div class="reader-box" id="reader-box">
    <div class="text-content" id="text-container"></div>
  </div>
</div>

<script>
  // Текст, который вы указали, зашит прямо здесь:
  const sourceText = `Русь! Русь! вижу тебя, из моего чудного, прекрасного далека тебя вижу: бедно, разбросанно и неприютно в тебе; не развеселят, не испугают взоров дерзкие дива природы, венчанные дерзкими дивами искусства, города с многооконными высокими дворцами, вросшими в утесы, картинные дерева и плющи, вросшие в домы, в шуме и в вечной пыли водопадов; не опрокинется назад голова посмотреть на громоздящиеся без конца над нею и в вышине каменные глыбы; не блеснут сквозь наброшенные одна на другую темные арки, опутанные виноградными сучьями, плющами и несметными миллионами диких роз, не блеснут сквозь них вдали вечные линии сияющих гор, несущихся в серебряные ясные небеса. Открыто-пустынно и ровно все в тебе; как точки, как значки, неприметно торчат среди равнин невысокие твои города; ничто не обольстит и не очарует взора. Но какая же непостижимая, тайная сила влечет к тебе? Почему слышится и раздается немолчно в ушах твоя тоскливая, несущаяся по всей длине и ширине твоей, от моря до моря, песня? Что в ней, в этой песне? Что зовет, и рыдает, и хватает за сердце? Какие звуки болезненно лобзают, и стремятся в душу, и вьются около моего сердца? Русь! чего же ты хочешь от меня? какая непостижимая связь таится между нами? Что глядишь ты так, и зачем все, что ни есть в тебе, обратило на меня полные ожидания очи?.. И еще, полный недоумения, неподвижно стою я, а уже главу осенило грозное облако, тяжелое грядущими дождями, и онемела мысль пред твоим пространством. Что пророчит сей необъятный простор? Здесь ли, в тебе ли не родиться беспредельной мысли, когда ты сама без конца? Здесь ли не быть богатырю, когда есть место, где развернуться и пройтись ему? И грозно объемлет меня могучее пространство, страшною силою отразясь во глубине моей; неестественной властью осветились мои очи: у! какая сверкающая, чудная, незнакомая земле даль! Русь!..`;

  let wordsData = [];
  let currentIndex = 0;
  let isListening = false;
  let recognition = null;

  const textContainer = document.getElementById('text-container');
  const btnToggle = document.getElementById('btn-toggle');
  const btnReset = document.getElementById('btn-reset');
  const btnText = document.getElementById('btn-text');
  const btnIcon = document.getElementById('btn-icon');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  function normalizeWord(word) {
    return word.toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9]/g, '');
  }

  function initText(rawText) {
    textContainer.innerHTML = '';
    wordsData = [];
    currentIndex = 0;

    const rawTokens = rawText.trim().split(/\s+/);

    rawTokens.forEach((token, index) => {
      const span = document.createElement('span');
      span.className = 'word';
      span.textContent = token;

      textContainer.appendChild(span);
      textContainer.appendChild(document.createTextNode(' '));

      wordsData.push({
        normalized: normalizeWord(token),
        element: span
      });
    });

    updateHighlights();
  }

  function updateHighlights() {
    wordsData.forEach((item, idx) => {
      item.element.classList.remove('read', 'next-target');
      if (idx < currentIndex) {
        item.element.classList.add('read');
      } else if (idx === currentIndex) {
        item.element.classList.add('next-target');
      }
    });

    if (currentIndex < wordsData.length) {
      wordsData[currentIndex].element.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function initSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert('Используйте Google Chrome или Яндекс Браузер.');
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'ru-RU';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript + ' ';
      }
      processSpokenText(transcript);
    };

    recognition.onend = () => {
      if (isListening) recognition.start();
    };
  }

  function processSpokenText(spokenTranscript) {
    const spokenWords = spokenTranscript.split(/\s+/).map(normalizeWord).filter(w => w.length > 0);
    if (spokenWords.length === 0) return;

    const searchWindow = 6;
    spokenWords.forEach(spoken => {
      for (let offset = 0; offset < searchWindow; offset++) {
        const targetIdx = currentIndex + offset;
        if (targetIdx >= wordsData.length) break;
        const targetWord = wordsData[targetIdx].normalized;

        if (targetWord && (spoken === targetWord || (spoken.length > 3 && targetWord.startsWith(spoken)))) {
          currentIndex = targetIdx + 1;
          updateHighlights();
          break;
        }
      }
    });
  }

  btnToggle.addEventListener('click', () => {
    if (isListening) {
      isListening = false;
      if (recognition) recognition.stop();
      btnToggle.classList.remove('recording');
      btnText.textContent = 'Начать чтение';
      btnIcon.textContent = '🎤';
      statusDot.classList.remove('active');
      statusText.textContent = 'Микрофон выключен';
    } else {
      if (!recognition) initSpeechRecognition();
      if (recognition) {
        recognition.start();
        isListening = true;
        btnToggle.classList.add('recording');
        btnText.textContent = 'Остановить';
        btnIcon.textContent = '⏹️';
        statusDot.classList.add('active');
        statusText.textContent = 'Слушаю ваш голос...';
      }
    }
  });

  btnReset.addEventListener('click', () => {
    currentIndex = 0;
    updateHighlights();
  });

  initText(sourceText);
</script>
</body>
</html>
