<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Суфлёр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0a0e14;
    --bg-grad-1: rgba(74, 158, 255, 0.08);
    --bg-grad-2: rgba(139, 92, 246, 0.08);
    --surface: rgba(22, 30, 44, 0.85);
    --border: rgba(255, 255, 255, 0.06);
    --text: #eef3fa;
    --muted: #7d8a9e;
    --read: #47536b;
    --accent: #4a9eff;
    --accent-2: #8b5cf6;
    --error: #f87171;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body::before,
  body::after {
    content: '';
    position: fixed;
    width: 60vw;
    height: 60vw;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
    pointer-events: none;
    opacity: 0.9;
  }
  body::before {
    top: -20vw;
    left: -15vw;
    background: radial-gradient(circle, var(--bg-grad-1) 0%, transparent 70%);
  }
  body::after {
    bottom: -25vw;
    right: -15vw;
    background: radial-gradient(circle, var(--bg-grad-2) 0%, transparent 70%);
  }

  .statusbar {
    position: fixed;
    top: env(safe-area-inset-top, 12px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--surface);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--muted);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    transition: color 0.25s ease;
    margin-top: 8px;
  }
  .statusbar.listening { color: #a7f3d0; }
  .statusbar.error { color: #fca5a5; }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.3s ease;
    flex-shrink: 0;
  }
  .dot.on {
    background: #10b981;
    box-shadow: 0 0 10px #10b981, 0 0 20px rgba(16, 185, 129, 0.4);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .dot.err {
    background: var(--error);
    box-shadow: 0 0 10px var(--error);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  .reader {
    position: fixed;
    top: 0;
    bottom: calc(120px + env(safe-area-inset-bottom, 0px));
    left: 0;
    right: 0;
    overflow-y: auto;
    padding: 80px 22px 60px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    z-index: 1;
  }
  .reader::-webkit-scrollbar { display: none; }

  .text {
    font-size: 1.45rem;
    line-height: 1.75;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.01em;
    word-spacing: 2px;
    max-width: 640px;
    margin: 0 auto;
    animation: fadeIn 0.6s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .word {
    display: inline;
    transition: color 0.4s ease, opacity 0.4s ease;
  }
  .word.read {
    color: var(--read);
    opacity: 0.5;
  }

  /* Первая подсказка — мягко пульсирует, пока не нажали старт */
  .hint {
    position: fixed;
    bottom: calc(110px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.85rem;
    color: var(--muted);
    z-index: 15;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.4s ease;
    white-space: nowrap;
    animation: hintPulse 2.4s ease-in-out infinite;
  }
  .hint.hidden { opacity: 0; }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .navbar {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 420px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px;
    background: var(--surface);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: 34px;
    box-shadow:
      0 20px 40px -10px rgba(0, 0, 0, 0.6),
      0 0 0 0.5px rgba(255, 255, 255, 0.05) inset;
    z-index: 20;
  }

  .navbtn {
    flex: 1;
    height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 0.7rem;
    font-weight: 500;
    font-family: inherit;
    border-radius: 26px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }
  .navbtn .icon {
    font-size: 1.3rem;
    line-height: 1;
    display: block;
  }
  .navbtn:active { transform: scale(0.94); }

  .navbtn.main {
    flex: 1.6;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.85rem;
    box-shadow:
      0 8px 20px -4px rgba(74, 158, 255, 0.5),
      0 0 0 0.5px rgba(255, 255, 255, 0.15) inset;
    flex-direction: row;
    gap: 8px;
  }
  .navbtn.main .icon { font-size: 1rem; }
  .navbtn.main:active { transform: scale(0.96); }
  .navbtn.main.paused {
    background: linear-gradient(135deg, #475569 0%, #334155 100%);
    box-shadow:
      0 8px 20px -4px rgba(71, 85, 105, 0.4),
      0 0 0 0.5px rgba(255, 255, 255, 0.1) inset;
  }
</style>
</head>
<body>

<div class="statusbar" id="statusbar">
  <div class="dot" id="dot"></div>
  <span id="status">Готов к чтению</span>
</div>

<div class="reader" id="reader">
  <div class="text" id="text"></div>
</div>

<div class="hint" id="hint">Нажми «Старт» — и читай вслух</div>

<div class="navbar">
  <button class="navbtn" id="btn-reset" aria-label="Сначала">
    <span class="icon">↺</span>
  </button>
  <button class="navbtn main" id="btn-toggle">
    <span class="icon" id="toggle-icon">▶</span>
    <span id="toggle-label">Старт</span>
  </button>
  <button class="navbtn" id="btn-font" aria-label="Размер шрифта">
    <span class="icon">Aa</span>
  </button>
</div>

<script>
const SOURCE = `Русь! Русь! вижу тебя, из моего чудного, прекрасного далека тебя вижу: бедно, разбросанно и неприютно в тебе; не развеселят, не испугают взоров дерзкие дива природы, венчанные дерзкими дивами искусства, города с многооконными высокими дворцами, вросшими в утесы, картинные дерева и плющи, вросшие в домы, в шуме и в вечной пыли водопадов; не опрокинется назад голова посмотреть на громоздящиеся без конца над нею и в вышине каменные глыбы; не блеснут сквозь наброшенные одна на другую темные арки, опутанные виноградными сучьями, плющами и несметными миллионами диких роз, не блеснут сквозь них вдали вечные линии сияющих гор, несущихся в серебряные ясные небеса. Открыто-пустынно и ровно все в тебе; как точки, как значки, неприметно торчат среди равнин невысокие твои города; ничто не обольстит и не очарует взора. Но какая же непостижимая, тайная сила влечет к тебе? Почему слышится и раздается немолчно в ушах твоя тоскливая, несущаяся по всей длине и ширине твоей, от моря до моря, песня? Что в ней, в этой песне? Что зовет, и рыдает, и хватает за сердце? Какие звуки болезненно лобзают, и стремятся в душу, и вьются около моего сердца? Русь! чего же ты хочешь от меня? какая непостижимая связь таится между нами? Что глядишь ты так, и зачем все, что ни есть в тебе, обратило на меня полные ожидания очи?.. И еще, полный недоумения, неподвижно стою я, а уже главу осенило грозное облако, тяжелое грядущими дождями, и онемела мысль пред твоим пространством. Что пророчит сей необъятный простор? Здесь ли, в тебе ли не родиться беспредельной мысли, когда ты сама без конца? Здесь ли не быть богатырю, когда есть место, где развернуться и пройтись ему? И грозно объемлет меня могучее пространство, страшною силою отразясь во глубине моей; неестественной властью осветились мои очи: у! какая сверкающая, чудная, незнакомая земле даль! Русь!..`;

const state = {
  words: [],
  idx: 0,
  listening: false,
  paused: false,
  lastAdvance: 0,
};

const $ = id => document.getElementById(id);
const readerEl = $('reader');
const textEl = $('text');
const dotEl = $('dot');
const statusEl = $('status');
const statusbarEl = $('statusbar');
const toggleBtn = $('btn-toggle');
const toggleIcon = $('toggle-icon');
const toggleLabel = $('toggle-label');
const hintEl = $('hint');

function normalize(w) {
  return w.toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9]/g, '');
}

function lev(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  if (Math.abs(a.length - b.length) > 2) return 99;
  const m = a.length, n = b.length;
  let prev = new Array(n + 1);
  let curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j-1] + 1, prev[j-1] + cost);
    }
    [prev, curr] = [curr, prev];
  }
  return prev[n];
}

function isMatch(spoken, target) {
  if (!spoken || !target) return false;
  if (spoken === target) return true;
  const len = Math.min(spoken.length, target.length);
  if (len <= 3) return spoken === target;
  if (len <= 5) return lev(spoken, target) <= 1;
  return lev(spoken, target) <= 2;
}

function initText(raw) {
  textEl.innerHTML = '';
  state.words = [];
  state.idx = 0;
  const tokens = raw.trim().split(/\s+/);
  tokens.forEach(tok => {
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = tok;
    textEl.appendChild(span);
    textEl.appendChild(document.createTextNode(' '));
    state.words.push({ raw: tok, norm: normalize(tok), el: span });
  });
  render();
}

function render() {
  state.words.forEach((w, i) => {
    w.el.classList.toggle('read', i < state.idx);
  });
  scrollToWord(state.idx, true);
}

let scrollAnim = null;
function scrollToWord(idx, smooth) {
  if (idx >= state.words.length) idx = state.words.length - 1;
  if (idx < 0) idx = 0;
  const el = state.words[idx]?.el;
  if (!el) return;

  const readerRect = readerEl.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  const targetOffset = readerRect.height * 0.38;
  const currentOffset = elRect.top - readerRect.top;
  const delta = currentOffset - targetOffset;
  const targetScroll = readerEl.scrollTop + delta;

  if (scrollAnim) cancelAnimationFrame(scrollAnim);
  if (!smooth) {
    readerEl.scrollTop = targetScroll;
    return;
  }

  const start = readerEl.scrollTop;
  const end = targetScroll;
  const dur = 480;
  const t0 = performance.now();
  const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;

  function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    readerEl.scrollTop = start + (end - start) * ease(p);
    if (p < 1) scrollAnim = requestAnimationFrame(step);
    else scrollAnim = null;
  }
  scrollAnim = requestAnimationFrame(step);
}

let recognition = null;
let restartTimer = null;

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setStatus('Распознавание не поддерживается', 'err');
    return false;
  }
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => setStatus('Слушаю...', 'on');

  recognition.onresult = (e) => {
    if (state.paused || !state.listening) return;
    let text = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      text += e.results[i][0].transcript + ' ';
    }
    handleSpoken(text);
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed') {
      setStatus('Нет доступа к микрофону', 'err');
      stopAll();
    } else if (e.error === 'no-speech') {
    } else {
      setStatus('Ошибка: ' + e.error, 'err');
    }
  };

  recognition.onend = () => {
    if (state.listening && !state.paused) {
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        try { recognition.start(); } catch (_) {}
      }, 300);
    }
  };
  return true;
}

const ADVANCE_COOLDOWN = 60;
const SEARCH_WINDOW = 3;

function handleSpoken(transcript) {
  const spokenWords = transcript.split(/\s+/).map(normalize).filter(w => w.length >= 2);
  if (!spokenWords.length) return;
  const now = performance.now();
  if (now - state.lastAdvance < ADVANCE_COOLDOWN) return;

  for (let s = spokenWords.length - 1; s >= 0; s--) {
    const spoken = spokenWords[s];
    for (let off = 0; off <= SEARCH_WINDOW; off++) {
      const targetIdx = state.idx + off;
      if (targetIdx >= state.words.length) break;
      const target = state.words[targetIdx].norm;
      if (!target) continue;
      if (isMatch(spoken, target)) {
        state.idx = targetIdx + 1;
        state.lastAdvance = now;
        render();
        return;
      }
    }
  }
}

function setStatus(text, mode) {
  statusEl.textContent = text;
  dotEl.classList.remove('on', 'err');
  statusbarEl.classList.remove('listening', 'error');
  if (mode === 'on') {
    dotEl.classList.add('on');
    statusbarEl.classList.add('listening');
  } else if (mode === 'err') {
    dotEl.classList.add('err');
    statusbarEl.classList.add('error');
  }
}

function start() {
  if (!recognition && !initRecognition()) return;
  try { recognition.start(); } catch (_) {}
  state.listening = true;
  state.paused = false;
  toggleIcon.textContent = '⏸';
  toggleLabel.textContent = 'Пауза';
  toggleBtn.classList.remove('paused');
  hintEl.classList.add('hidden');
  setStatus('Слушаю...', 'on');
  window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('medium');
}

function pause() {
  state.paused = true;
  state.listening = false;
  try { recognition && recognition.stop(); } catch (_) {}
  toggleIcon.textContent = '▶';
  toggleLabel.textContent = 'Продолжить';
  toggleBtn.classList.add('paused');
  setStatus('Пауза');
}

function stopAll() {
  state.listening = false;
  state.paused = false;
  try { recognition && recognition.stop(); } catch (_) {}
  toggleIcon.textContent = '▶';
  toggleLabel.textContent = 'Старт';
  toggleBtn.classList.add('paused');
  setStatus('Остановлено');
}

toggleBtn.addEventListener('click', () => {
  if (state.listening) pause();
  else start();
});

$('btn-reset').addEventListener('click', () => {
  state.idx = 0;
  render();
  readerEl.scrollTop = 0;
  window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light');
});

const FONT_STEPS = [1.45, 1.65, 1.85];
let fontStep = 0;
$('btn-font').addEventListener('click', () => {
  fontStep = (fontStep + 1) % FONT_STEPS.length;
  textEl.style.fontSize = FONT_STEPS[fontStep] + 'rem';
  window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light');
});

try {
  if (window.Telegram?.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.disableVerticalSwipes?.();
    tg.setHeaderColor?.('#0a0e14');
    tg.setBackgroundColor?.('#0a0e14');
  }
} catch (_) {}

initText(SOURCE);
</script>
</body>
</html>
